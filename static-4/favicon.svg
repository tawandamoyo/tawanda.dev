<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ground { fill: #F7F8F3; }
    .sun { fill: #2F6B45; }
    .horizon { stroke: #2F6B45; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #0F130F; }
      .sun { fill: #8CC29B; }
      .horizon { stroke: #8CC29B; }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="6" />
  <circle class="sun" cx="16" cy="14" r="6" />
  <line class="horizon" x1="6" y1="23" x2="26" y2="23" />
</svg>
